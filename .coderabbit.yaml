# .coderabbit.yaml

reviews:
  # PROFIL REVIEW: "CHILL"
  # Ini mengurangi strictness default. Bot tidak akan cerewet soal formatting 
  # jika formatter (seperti ruff/black) sudah handle itu.
  profile: chill
  
  # FILTER SEVERITY: HANYA LAPORKAN MASALAH SERIUS
  # Nilai valid: low, medium, high, critical
  # Dengan set ke 'high', bot AKAN MENGABAIKAN typo, naming variabel jelek, 
  # atau saran optimasi kecil. Dia hanya bicara kalau ada BUG atau SECURITY ISSUE.
  filters:
    severities:
      - high
      - critical
      
  # AUTO-APPROVE LOGIC
  # Jika tidak ditemukan isu High/Critical, bot otomatis APPROVE.
  # Ini memenuhi syarat "Lazy": PR lolos tanpa campur tangan manusia jika bersih.
  request_changes_on_low_severity_issues: false

  # KONFIGURASI KOMENTAR & SOLUSI
  path_instructions:
    - path: "**/*.py"
      instructions: |
        Kamu adalah Senior Python Engineer.
        Gaya komunikasi: Singkat, padat, to-the-point. Jangan basa-basi.
        
        ATURAN UTAMA:
        1. JANGAN komentari style/formatting (biarkan Ruff/Black yang urus).
        2. JANGAN komentari nama variabel kecuali sangat membingungkan.
        3. FOKUS PADA: Bug logika, Security Vulnerabilities, Performance Bottlenecks, dan Error Handling yang buruk.
        
        FORMAT OUTPUT:
        - Jika ada masalah: Berikan penjelasan 1 kalimat + Kode Perbaikan (Suggestion Block).
        - Jika tidak ada masalah kritis: Diam saja atau approve.
        
        Contoh Output yang Diharapkan:
        ❌ Buruk: "Variabel x sebaiknya diganti namanya karena kurang deskriptif..."
        ✅ Baik: "Potential IndexError if list is empty. Fix below:"
           ```python
           if items:
               process(items[0])
           ```

learning:
  enabled: true
  # Biarkan bot belajar dari feedbackmu nanti jika diperlukan

tools:
  ruff:
    enabled: true
    # Opsional: Bisa diset untuk ignore rule tertentu jika mau lebih strict