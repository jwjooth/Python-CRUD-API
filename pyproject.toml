[project]
name = "python-restful-api"
version = "0.1.0"
description = "Layered RESTful API built with FastAPI, SQLAlchemy, and MySQL"
readme = "README.md"
authors = [
    { name = "jwjooth", email = "185214226+jwjooth@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "sqlalchemy==2.0.54",
    "pymysql==1.2.3",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[project.scripts]
python-restful-api = "python_restful_api:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
